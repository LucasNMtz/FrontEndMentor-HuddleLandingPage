<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Huddle landing page with single introductory section</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" type="text/css" href="normalize_v8.0.1.css">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
  <header><a href="#" id="main-logo-a"><figure><img src="images/logo.svg" alt="Logo"></figure></a></header>

  <main>
    <figure id="main-figure"><img src="images/illustration-mockups.svg" alt="Illust"></figure>

    <div id="main-text-container">
      <h1>Build The Community Your Fans Will Love</h1>
      
      <p>
        Huddle re-imagines the way we build communities. You have a voice, but so does your audience. 
        Create connections with your users as you engage in genuine discussion. 
      </p>
  
      <button>Register</button>
    </div>
  </main>
  
  <footer>
    <div id="social-logos-container">
      <a href="https://www.facebook.com/" target="_blank" class="social-logo-a"><figure id="facebook-logo" class="social-logo"></figure></a>
      <a href="https://twitter.com/" target="_blank" class="social-logo-a"><figure id="twitter-logo" class="social-logo"></figure></a>
      <a href="https://www.instagram.com/" target="_blank" class="social-logo-a"><figure id="instagram-logo" class="social-logo"></figure></a>
    </div>

    <p class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">Lucas</a>.
    </p>
  </footer>
</body>
</html>
